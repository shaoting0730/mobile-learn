name: Test Translate Workflow

on:
  workflow_dispatch:
  push:
    paths:
      - README.md

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Echo and create test file
        run: |
          echo "Workflow ran successfully"
          echo "ok" > README.test.md

      - name: Commit test file
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add README.test.md || true
          git commit -m "chore: add test file" || echo "No changes to commit"
          git push || echo "push failed (if read-only token)"
