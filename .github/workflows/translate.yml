name: Call Reusable Translate

on:
push: paths: [README.md]

jobs:
  call-translate:
    uses: shaoting0730/workflow-templates/.github/workflows/translate-readme.yml@main
    with:
      file: README.md
    secrets:
      # 如果被调用 workflow 需要 OPENAI_API_KEY 且你在 caller 仓库的 Secrets 有配置：
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
